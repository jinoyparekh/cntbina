name: Terraform

on:
  # Auto-triggered only after Module Tests workflow completes successfully on master.
  # This enforces the order: all module tests pass → plan → apply.
  workflow_run:
    workflows: ["Module Tests"]
    types: [completed]
    branches: [master]
  # Manual escape hatch: run plan or apply without the test gate (e.g. re-apply, emergency).
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform/
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

# ── STAGE 1: plan ────────────────────────────────────────────────────────────────
# Skipped entirely when Module Tests did not succeed (no need for a separate gate job).
jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run events use the SHA that triggered the tests, not the default branch HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-${{ runner.os }}-${{ hashFiles('terraform/versions.tf') }}
          restore-keys: tf-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
        working-directory: ${{ env.TF_DIR }}

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

      - name: Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}tfplan
          retention-days: 1

# ── STAGE 2: apply ───────────────────────────────────────────────────────────────
# Runs automatically after a successful push-triggered plan (workflow_run path).
# On manual dispatch, only runs when action == apply.
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-${{ runner.os }}-${{ hashFiles('terraform/versions.tf') }}
          restore-keys: tf-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
        working-directory: ${{ env.TF_DIR }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}
