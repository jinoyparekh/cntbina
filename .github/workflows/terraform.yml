name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform/
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

# ── STAGE 1: detect which modules changed ─────────────────────────────────────
jobs:
  detect-modules:
    name: Detect modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules:     ${{ steps.changed.outputs.modules }}
      any_changed: ${{ steps.changed.outputs.any_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve modules to test
        id: changed
        run: |
          EVENT="${{ github.event_name }}"

          scan_all() {
            find terraform/tests -name '*_unit.tftest.hcl' \
              | xargs -I{} basename {} _unit.tftest.hcl \
              | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          if [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            # push to main or manual trigger: always test ALL modules before apply
            MODULES=$(scan_all)
          else
            # PRs: only test changed modules for faster feedback
            BASE="${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only "$BASE" HEAD)
            FROM_MODULES=$(echo "$CHANGED" | grep -E '^terraform/modules/' | cut -d'/' -f3)
            FROM_TESTS=$(echo "$CHANGED" | grep -oP '(?<=terraform/tests/)[a-z0-9_]+(?=_)')
            MODULES=$(printf '%s\n%s' "$FROM_MODULES" "$FROM_TESTS" \
              | grep -v '^$' | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          if [ "$MODULES" = "[]" ] || [ -z "$MODULES" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo "modules=[]"        >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true"  >> "$GITHUB_OUTPUT"
            echo "modules=$MODULES"  >> "$GITHUB_OUTPUT"
          fi

# ── STAGE 2: unit tests per module (parallel, no GCP creds) ───────────────────
  unit-tests:
    name: "Test: ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: detect-modules
    if: needs.detect-modules.outputs.any_changed == 'true'
    permissions:
      contents: read   # no id-token — mock provider, zero GCP calls

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-${{ runner.os }}-${{ hashFiles('terraform/versions.tf') }}
          restore-keys: tf-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - run: terraform init -backend=false
        working-directory: ${{ env.TF_DIR }}

      - name: Run tests
        run: terraform test -filter=tests/${{ matrix.module }}_unit.tftest.hcl -verbose
        working-directory: ${{ env.TF_DIR }}

# ── STAGE 3: gate — blocks plan/apply if any unit test failed ─────────────────
  tests-gate:
    name: Tests gate
    runs-on: ubuntu-latest
    needs: [detect-modules, unit-tests]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Evaluate
        run: |
          CHANGED="${{ needs.detect-modules.outputs.any_changed }}"
          RESULT="${{ needs.unit-tests.result }}"
          if [ "$CHANGED" = "false" ]; then
            echo "No module changes — gate passes."; exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            echo "All unit tests passed — gate passes."; exit 0
          fi
          echo "Unit tests ${RESULT} — blocking terraform pipeline."; exit 1

# ── STAGE 4: plan (always runs on push/PR/dispatch, never applies) ────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: tests-gate

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-${{ runner.os }}-${{ hashFiles('terraform/versions.tf') }}
          restore-keys: tf-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
        working-directory: ${{ env.TF_DIR }}

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

      - name: Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ env.TF_DIR }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}tfplan
          retention-days: 1

# ── STAGE 5: apply (main push OR manual apply — uses exact plan from stage 4) ─
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-${{ runner.os }}-${{ hashFiles('terraform/versions.tf') }}
          restore-keys: tf-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
        working-directory: ${{ env.TF_DIR }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}
