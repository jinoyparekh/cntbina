name: Module Tests

# Runs automatically on push to master and chains into terraform.yml on success.
# Can also be triggered manually to run tests ad-hoc without a full plan/apply.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      module:
        description: "Module to test (leave blank to test all)"
        required: false
        default: ""

# Minimum permissions — no GCP auth needed for mock-provider unit tests
permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  # ── Detect which modules changed ─────────────────────────────────────────────
  detect-modules:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changed.outputs.modules }}
      any_changed: ${{ steps.changed.outputs.any_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed modules
        id: changed
        run: |
          MANUAL_MODULE="${{ inputs.module }}"

          if [ -n "$MANUAL_MODULE" ]; then
            MODULES=$(echo "$MANUAL_MODULE" | jq -R -c '[.]')
          else
            MODULES=$(find terraform/tests -name '*_unit.tftest.hcl' \
              | xargs -I{} basename {} _unit.tftest.hcl \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          if [ "$MODULES" = "[]" ] || [ -z "$MODULES" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            echo "modules=[]"        >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true"  >> "$GITHUB_OUTPUT"
            echo "modules=$MODULES"  >> "$GITHUB_OUTPUT"
          fi

  # ── Unit test each changed module in parallel ─────────────────────────────────
  unit-test:
    name: "Test: ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: detect-modules
    if: needs.detect-modules.outputs.any_changed == 'true'

    strategy:
      fail-fast: false   # run all modules even if one fails; see all breakage at once
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # re-download only when provider versions change
          key: tf-${{ runner.os }}-${{ hashFiles('terraform/versions.tf', 'terraform/.terraform.lock.hcl') }}
          restore-keys: tf-${{ runner.os }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform/

      - name: Run unit tests — ${{ matrix.module }}
        run: terraform test -filter=tests/${{ matrix.module }}_unit.tftest.hcl -verbose
        working-directory: terraform/

  # ── Required status check (always passes if no modules changed) ───────────────
  module-tests-complete:
    name: Module tests complete
    runs-on: ubuntu-latest
    needs: [detect-modules, unit-test]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.detect-modules.outputs.any_changed }}" = "false" ]; then
            echo "No module changes detected — skipping."
            exit 0
          fi
          if [ "${{ needs.unit-test.result }}" != "success" ]; then
            echo "Unit tests failed."
            exit 1
          fi
          echo "All module tests passed."
